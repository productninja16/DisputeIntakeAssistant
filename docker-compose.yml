services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dispute_intake
      POSTGRES_USER: dispute_intake
      POSTGRES_PASSWORD: dispute_intake
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispute_intake -d dispute_intake"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
