<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Report a problem')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <h1>Report a problem with a charge</h1>
  <p class="notice">Please do not enter card numbers or other personal details. Any card-like numbers
    are removed automatically.</p>
  <form th:action="@{/disputes}" th:object="${disputeForm}" method="post" class="stack">
    <fieldset>
      <legend>1. Which transaction?</legend>
      <p class="error" th:if="${#fields.hasErrors('transactionId')}" th:errors="*{transactionId}">Error</p>
      <label th:each="o : ${options}" class="choice" th:classappend="${o.disputeOpen} ? 'disabled'">
        <input type="radio" name="transactionId" th:value="${o.id}" th:disabled="${o.disputeOpen}"
               th:required="${!o.disputeOpen}" th:checked="${disputeForm.transactionId == o.id}">
        <span class="choice-main">
          <strong th:text="${o.merchantName}">Merchant</strong>
          <span th:text="${o.amount}">$0.00</span>
        </span>
        <span class="choice-sub">
          <span th:text="${o.postedOn} + ' · card ending ' + ${o.cardLast4}">2026-01-01 · card ending 0000</span>
          <em th:if="${o.disputeOpen}">Problem already reported</em>
        </span>
      </label>
    </fieldset>
    <fieldset>
      <legend>2. What went wrong?</legend>
      <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">Error</p>
      <label for="description" class="muted-text">Tell us in your own words what happened (10 to 4000 characters).</label>
      <textarea id="description" name="description" rows="6" required minlength="10" maxlength="4000"
                th:text="${disputeForm.description}"
                placeholder="For example: I was charged twice for the same order."></textarea>
    </fieldset>
    <button type="submit">Submit</button>
  </form>
</main>
</body>
</html>
