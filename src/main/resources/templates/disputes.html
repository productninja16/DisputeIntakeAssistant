<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My disputes')}"></head>
<body>
<header th:replace="~{fragments :: header}"></header>
<main>
  <h1>My disputes</h1>
  <p><a class="button" th:href="@{/disputes/new}">Report a problem with a charge</a></p>
  <p th:if="${#lists.isEmpty(disputes)}">You have not reported any problems yet.</p>
  <table th:unless="${#lists.isEmpty(disputes)}">
    <thead><tr><th>Case</th><th>Merchant</th><th>Amount</th><th>Charged on</th><th>Reported</th><th>Status</th></tr></thead>
    <tbody>
      <tr th:each="d : ${disputes}">
        <td th:text="${d.caseRef}">D-00000000</td>
        <td th:text="${d.merchantName}">Merchant</td>
        <td th:text="${d.amount}">$0.00</td>
        <td th:text="${d.postedOn}">2026-01-01</td>
        <td th:text="${#temporals.format(d.createdAt, 'yyyy-MM-dd HH:mm', 'UTC')}">2026-01-01</td>
        <td th:text="${d.statusLabel}">In review</td>
      </tr>
    </tbody>
  </table>
</main>
</body>
</html>
