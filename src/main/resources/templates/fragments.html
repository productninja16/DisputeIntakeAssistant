<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title} + ' · Dispute Intake'">Dispute Intake</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header">
  <a class="brand" th:href="@{/}">Dispute Intake</a>
  <span class="demo-badge">Demo · synthetic data</span>
  <form th:if="${currentCustomer != null}" th:action="@{/sign-out}" method="post" class="signed-in">
    <span th:text="${currentCustomer.displayName} + ' (' + ${currentCustomer.customerRef} + ')'">Name</span>
    <button type="submit" class="link">Sign out</button>
  </form>
  <form th:if="${currentAnalyst != null}" th:action="@{/analyst/sign-out}" method="post" class="signed-in">
    <span th:text="'Analyst: ' + ${currentAnalyst}">Analyst</span>
    <button type="submit" class="link">Sign out</button>
  </form>
</header>
<nav th:fragment="analystNav" class="subnav">
  <a th:href="@{/analyst/queue}">Queue</a>
  <a th:href="@{/analyst/history}">History</a>
</nav>
</body>
</html>
