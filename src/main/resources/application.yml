spring:
  application:
    name: dispute-intake-assistant
  # Local secrets (ANTHROPIC_API_KEY, SUGGESTION_CLIENT, ...) come from the git-ignored .env in the
  # working directory. Optional, so a missing file is fine; real environment variables still win.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dispute_intake}
    username: ${DB_USER:dispute_intake}
    password: ${DB_PASSWORD:dispute_intake}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

# The key is read from the environment (see .env.example); never commit it.
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-haiku-5-5}

# stub (default, no network) or anthropic (real model; needs ANTHROPIC_API_KEY)
suggestion:
  client: ${SUGGESTION_CLIENT:stub}
